name: My first Workflow

on: 
  push:
    branches:
      - main
  pull_request_target:
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: run the tests
        run: python -m pytest -q
